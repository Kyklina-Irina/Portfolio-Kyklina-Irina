<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Куклина Ирина | QA Automation Engineer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a081a;
  --bg-secondary: #120f28;
  --bg-tertiary: #1a1535;
  --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  --gradient-secondary: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --gradient-accent: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
  --text-light: #ffffff;
  --card-bg: rgba(25, 20, 55, 0.92);
  --card-border: rgba(102, 126, 234, 0.5);
  --shadow-neon: 0 0 25px rgba(102, 126, 234, 0.6);
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Montserrat', sans-serif;
  line-height: 1.8;
  overflow-x: hidden;
  background: var(--bg-primary);
  color: var(--text-light);
  position: relative;
}

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 0.8rem 2%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(10, 8, 26, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--card-border);
  z-index: 1000;
  transition: var(--transition);
}

.logo {
  font-size: 1.8rem;
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}

nav ul {
  display: none;
  list-style: none;
  gap: 1rem;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: rgba(10, 8, 26, 0.95);
  padding: 1rem 0;
  border-radius: 0 0 10px 10px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}

nav ul.active {
  display: flex;
  flex-direction: column;
  align-items: center;
}

nav a {
  text-decoration: none;
  color: var(--text-light);
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 1rem;
  padding: 0.5rem 0;
  transition: var(--transition);
}

nav a:hover {
  color: transparent;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.menu-toggle {
  display: block;
  font-size: 1.4rem;
  color: var(--text-light);
  background: none;
  border: none;
  cursor: pointer;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.language-switch {
  display: flex;
  gap: 0.6rem;
  background: rgba(102, 126, 234, 0.25);
  padding: 0.2rem 0.4rem;
  border-radius: 15px;
  border: 1px solid var(--card-border);
}

.language-switch button {
  background: none;
  border: none;
  padding: 0.25rem 0.6rem;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 600;
  transition: var(--transition);
  color: var(--text-light);
  font-size: 0.85rem;
}

.language-switch button.active {
  background: var(--gradient-primary);
  color: white;
  box-shadow: var(--shadow-neon);
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 0 2%;
  position: relative;
  text-align: center;
  overflow: hidden;
  padding-top: 70px;
}

.hero-content {
  max-width: 100%;
  width: 100%;
  animation: fadeInUp 1s ease-out;
  z-index: 1;
}

.hero h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 2.8rem;
  margin-bottom: 0.8rem;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
  line-height: 1.2;
}

.hero-subtitle {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.4rem;
  margin-bottom: 1.2rem;
  background: var(--gradient-secondary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 600;
}

.hero p {
  font-size: 1rem;
  margin-bottom: 1.5rem;
  color: var(--text-light);
  opacity: 0.95;
  max-width: 100%;
  line-height: 1.7;
  font-family: 'Playfair Display', serif;
  font-style: italic;
}

.qa-badge {
  display: inline-block;
  background: var(--gradient-accent);
  color: white;
  padding: 0.3rem 1.2rem;
  border-radius: 20px;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 1.1rem;
  margin: 1rem 0;
  box-shadow: 0 0 15px rgba(67, 233, 123, 0.6);
}

.hero-buttons {
  display: flex;
  gap: 0.8rem;
  justify-content: center;
  margin-top: 1rem;
  flex-wrap: wrap;
}

.btn {
  padding: 0.8rem 2rem;
  border-radius: 25px;
  text-decoration: none;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 0.95rem;
  font-weight: 700;
  border: 1.5px solid rgba(102, 126, 234, 0.6);
  transition: var(--transition);
  color: white;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.btn-primary {
  background: var(--gradient-primary);
  border: none;
}

.btn-secondary {
  background: transparent;
}

.btn:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 0 25px rgba(102, 126, 234, 0.7);
}

section {
  padding: 4rem 2%;
  max-width: 1200px;
  margin: 0 auto;
}

.section-title {
  font-family: 'Dancing Script', cursive;
  font-size: 2.3rem;
  margin-bottom: 2rem;
  text-align: center;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
}

.about-text h3 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.4rem;
  margin-bottom: 1rem;
  background: var(--gradient-secondary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
}

.about-text p {
  line-height: 1.8;
  color: var(--text-light);
  opacity: 0.95;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1rem;
  margin-bottom: 1rem;
}

.highlight {
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
}

.skills-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
  max-width: 100%;
  margin: 0 auto;
}

.skill-category {
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  padding: 1.5rem;
  backdrop-filter: blur(8px);
  transition: var(--transition);
}

.skill-category:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-neon);
  border-color: rgba(102, 126, 234, 0.8);
}

.skill-category h3 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.2rem;
  margin-bottom: 1rem;
  background: var(--gradient-secondary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.skill-tag {
  background: rgba(102, 126, 234, 0.2);
  border: 1px solid var(--card-border);
  color: var(--text-light);
  padding: 0.4rem 1rem;
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 500;
  transition: var(--transition);
}

.skill-tag:hover {
  background: rgba(102, 126, 234, 0.4);
  transform: translateY(-2px);
}

.projects-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.5rem;
}

.project-card {
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  padding: 1.8rem;
  backdrop-filter: blur(8px);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.project-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--gradient-primary);
}

.project-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
  border-color: rgba(102, 126, 234, 0.8);
}

.project-card h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  margin-bottom: 0.8rem;
  color: var(--text-light);
  font-weight: 700;
}

.project-card .project-desc {
  color: var(--text-light);
  opacity: 0.9;
  font-size: 0.95rem;
  margin-bottom: 1rem;
  font-family: 'Playfair Display', serif;
  font-style: italic;
}

.project-tech {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1.2rem;
}

.tech-tag {
  background: rgba(67, 233, 123, 0.2);
  border: 1px solid rgba(67, 233, 123, 0.5);
  color: #43e97b;
  padding: 0.25rem 0.8rem;
  border-radius: 15px;
  font-size: 0.8rem;
  font-weight: 600;
}

.project-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: #4facfe;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
  transition: var(--transition);
}

.project-link:hover {
  color: #00f2fe;
  gap: 0.8rem;
}

.experience-container,
.education-container {
  display: grid;
  gap: 1.5rem;
  max-width: 900px;
  margin: 0 auto;
}

.content-card {
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  padding: 1.8rem;
  backdrop-filter: blur(8px);
  transition: var(--transition);
  position: relative;
}

.content-card:hover {
  transform: translateX(6px);
  border-color: rgba(102, 126, 234, 0.8);
  box-shadow: var(--shadow-neon);
}

.content-card h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  margin-bottom: 0.4rem;
  color: var(--text-light);
  font-weight: 700;
}

.company, .institution {
  display: block;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.1rem;
  color: #4facfe;
  margin-bottom: 0.4rem;
  font-weight: 600;
}

.period {
  display: inline-block;
  background: rgba(102, 126, 234, 0.25);
  color: white;
  padding: 0.25rem 1rem;
  border-radius: 15px;
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 0.8rem;
  border: 1px solid var(--card-border);
}

.content-card p {
  line-height: 1.7;
  color: var(--text-light);
  opacity: 0.95;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 0.95rem;
}

.content-card ul {
  list-style: none;
  padding: 0;
  margin-top: 0.5rem;
}

.content-card ul li {
  padding-left: 1.5rem;
  position: relative;
  margin-bottom: 0.4rem;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 0.95rem;
